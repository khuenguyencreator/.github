<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Khuê Nguyễn Creator — Mã nguồn tự học Nhúng, IoT &amp; PCB">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#0e75b6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .trace { fill: none; stroke: #5fd3ff; stroke-width: 2; stroke-opacity: 0.55; stroke-dasharray: 8 6; animation: flow 3s linear infinite; }
      .pad { fill: #5fd3ff; fill-opacity: 0.8; }
      .title { font: 700 50px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .sub { font: 400 24px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #cfe8ff; }
      .tag { font: 600 16px Consolas, 'Courier New', monospace; fill: #5fd3ff; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
    </style>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- PCB-like traces -->
  <path class="trace" d="M0 60H180L220 100H300"/>
  <path class="trace" d="M0 250H140L180 210H280"/>
  <path class="trace" d="M1200 50H1030L990 90H900"/>
  <path class="trace" d="M1200 240H1060L1020 200H920"/>
  <circle class="pad" cx="300" cy="100" r="5"/>
  <circle class="pad" cx="280" cy="210" r="5"/>
  <circle class="pad" cx="900" cy="90" r="5"/>
  <circle class="pad" cx="920" cy="200" r="5"/>

  <!-- MCU chip (left) -->
  <g transform="translate(110 115)" opacity="0.9">
    <rect x="0" y="0" width="70" height="70" rx="8" fill="#0b1f3a" stroke="#5fd3ff" stroke-width="2"/>
    <text x="35" y="42" text-anchor="middle" class="tag">MCU</text>
    <g stroke="#5fd3ff" stroke-width="2">
      <path d="M12 0V-10M26 0V-10M44 0V-10M58 0V-10"/>
      <path d="M12 70V80M26 70V80M44 70V80M58 70V80"/>
      <path d="M0 12H-10M0 26H-10M0 44H-10M0 58H-10"/>
      <path d="M70 12H80M70 26H80M70 44H80M70 58H80"/>
    </g>
  </g>

  <!-- PCB footprint (right) -->
  <g transform="translate(1020 115)" opacity="0.9">
    <rect x="0" y="0" width="70" height="70" rx="4" fill="none" stroke="#5fd3ff" stroke-width="2" stroke-dasharray="4 3"/>
    <g fill="#5fd3ff" fill-opacity="0.8">
      <rect x="8" y="10" width="14" height="10" rx="2"/>
      <rect x="48" y="10" width="14" height="10" rx="2"/>
      <rect x="8" y="50" width="14" height="10" rx="2"/>
      <rect x="48" y="50" width="14" height="10" rx="2"/>
    </g>
    <text x="35" y="40" text-anchor="middle" class="tag">PCB</text>
  </g>

  <text x="600" y="130" text-anchor="middle" class="title">Khuê Nguyễn Creator</text>
  <text x="600" y="175" text-anchor="middle" class="sub">Mã nguồn tự học Lập trình Nhúng · IoT · Thiết kế PCB</text>
  <text x="600" y="220" text-anchor="middle" class="tag">STM32 · ESP32 · 8051 · FreeRTOS · Altium · Embedded Linux · AOSP</text>
</svg>
